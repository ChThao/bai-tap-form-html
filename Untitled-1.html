<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Tạo Form Đơn Giản</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 500px; margin-bottom: 30px; background-color: #f9f9f9; }
        h2 { color: #333; }
        div { margin-bottom: 15px; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"], select, textarea {
            width: 65%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .radio-group, .checkbox-group { display: inline-block; width: 65%; }
        .radio-group label, .checkbox-group label { width: auto; font-weight: normal; margin-right: 10px; }
        .buttons { margin-top: 20px; text-align: center; }
        input[type="submit"] { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        input[type="reset"] { background-color: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 10px; }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM SỞ THÍCH -->
    <h2>Phần 1: Form Sở Thích</h2>
    <form action="#" method="post">
        <div>
            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname">
        </div>
        <div>
            <label for="email_p1">Email:</label>
            <input type="text" id="email_p1" name="email">
        </div>
        <div>
            <label>Sở thích:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="p1_thethao" name="hobby" value="thethao"> <label for="p1_thethao">Thể thao</label>
                <input type="checkbox" id="p1_amnhac" name="hobby" value="amnhac"> <label for="p1_amnhac">Âm nhạc</label>
                <input type="checkbox" id="p1_docsach" name="hobby" value="docsach"> <label for="p1_docsach">Đọc sách</label>
            </div>
        </div>
        <div class="buttons">
            <input type="submit" value="Gửi thông tin">
            <input type="reset" value="Nhập lại">
        </div>
    </form>

    <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
    <h2>Phần 2: Form Đăng Ký Học Viên</h2>
    <form action="#" method="post">
        <div>
            <label for="fullname">Họ và tên:</label>
            <input type="text" id="fullname" name="fullname">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="phone">Số điện thoại:</label>
            <input type="text" id="phone" name="phone">
        </div>
        <div>
            <label for="birthday">Ngày sinh:</label>
            <input type="date" id="birthday" name="birthday">
        </div>
        <div>
            <label>Giới tính:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="nam"> <label for="male">Nam</label>
                <input type="radio" id="female" name="gender" value="nu"> <label for="female">Nữ</label>
                <input type="radio" id="other" name="gender" value="khac"> <label for="other">Khác</label>
            </div>
        </div>
        <div>
            <label for="address">Địa chỉ:</label>
            <textarea id="address" name="address" rows="3"></textarea>
        </div>
        <div>
            <label for="course">Khóa học:</label>
            <select id="course" name="course">
                <option value="html_css">HTML & CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
                <option value="python">Python</option>
            </select>
        </div>
        <div>
            <label>Hình thức học:</label>
            <div class="radio-group">
                <input type="radio" id="online" name="study_type" value="online"> <label for="online">Online</label>
                <input type="radio" id="offline" name="study_type" value="offline"> <label for="offline">Offline</label>
            </div>
        </div>
        <div>
            <label>Sở thích:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="codegym" name="hobby" value="laptrinh"> <label for="codegym">Lập trình</label>
                <input type="checkbox" id="game" name="hobby" value="choigame"> <label for="game">Chơi game</label>
                <input type="checkbox" id="travel" name="hobby" value="dulich"> <label for="travel">Du lịch</label>
            </div>
        </div>
        <div>
            <label for="note">Ghi chú:</label>
            <textarea id="note" name="note" rows="3"></textarea>
        </div>
        <div class="buttons">
            <input type="submit" value="Đăng ký">
            <input type="reset" value="Nhập lại">
        </div>
    </form>

</body>
</html>
